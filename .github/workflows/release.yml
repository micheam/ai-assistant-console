name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'

    - name: Get tag name
      id: tag
      run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Build binaries
      run: |
        # Build for multiple platforms
        GOOS=linux GOARCH=amd64 go build -ldflags "-X main.version=${{ steps.tag.outputs.tag }}" -o aico-linux-amd64 ./cmd/aico
        GOOS=linux GOARCH=arm64 go build -ldflags "-X main.version=${{ steps.tag.outputs.tag }}" -o aico-linux-arm64 ./cmd/aico
        GOOS=darwin GOARCH=amd64 go build -ldflags "-X main.version=${{ steps.tag.outputs.tag }}" -o aico-darwin-amd64 ./cmd/aico
        GOOS=darwin GOARCH=arm64 go build -ldflags "-X main.version=${{ steps.tag.outputs.tag }}" -o aico-darwin-arm64 ./cmd/aico

    - name: Prepare release body
      id: release_body
      env:
        # Workload identity federation: the SDK exchanges the GitHub OIDC
        # token in ANTHROPIC_IDENTITY_TOKEN_FILE for a short-lived access token.
        ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
        ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
        ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
        ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
        ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/anthropic-identity-token
      run: |
        sudo apt-get update && sudo apt-get install -y jq
        commits=$(./script/prepare_release_body.sh)

        # Summarize the release in one line with the aico binary being released.
        # The release goes out with the commit list alone if this fails or the
        # output is not a single line.
        system='You write one-line summaries for release notes. Output only the one-sentence summary: no preamble, no revision process, no headings, no bullet points, and no Markdown formatting.'
        prompt='From the input commit list, summarize the key points of this release in one English sentence (at most 100 characters). Do not speculate about reasons or impacts that are not stated in the list.'
        summary=""
        if [ -n "$commits" ]; then
          # GitHub's OIDC token expires in about five minutes; fetch it right
          # before use.
          curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
            | jq -r .value > "$ANTHROPIC_IDENTITY_TOKEN_FILE" || true
          summary=$(echo "$commits" | timeout 120 ./aico-linux-amd64 --no-stream -m anthropic:claude-haiku-5-5 --system "$system" "$prompt") || summary=""
          if [ -z "$summary" ] || [ "$(echo "$summary" | wc -l)" -ne 1 ]; then
            echo "::warning::No one-line summary was generated; publishing the commit list alone"
            printf '%s\n' "$summary" | sed 's/^/> /'
            summary=""
          fi
        fi

        {
          echo "body<<EOF"
          if [ -n "$summary" ]; then
            echo "$summary"
            echo
          fi
          echo "$commits"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Create tar.gz archives
      run: |
        # Create archives for each platform
        # Archive format: aico_<os>_<arch>.tar.gz containing a single binary named "aico"

        # Linux AMD64
        cp aico-linux-amd64 aico
        tar -czf aico_linux_amd64.tar.gz aico
        rm aico

        # Linux ARM64
        cp aico-linux-arm64 aico
        tar -czf aico_linux_arm64.tar.gz aico
        rm aico

        # Darwin AMD64
        cp aico-darwin-amd64 aico
        tar -czf aico_darwin_amd64.tar.gz aico
        rm aico

        # Darwin ARM64
        cp aico-darwin-arm64 aico
        tar -czf aico_darwin_arm64.tar.gz aico
        rm aico

    - name: Generate checksums
      run: |
        # Generate SHA256 checksums for each tar.gz archive
        shasum -a 256 aico_linux_amd64.tar.gz > aico_linux_amd64.tar.gz.sha256
        shasum -a 256 aico_linux_arm64.tar.gz > aico_linux_arm64.tar.gz.sha256
        shasum -a 256 aico_darwin_amd64.tar.gz > aico_darwin_amd64.tar.gz.sha256
        shasum -a 256 aico_darwin_arm64.tar.gz > aico_darwin_arm64.tar.gz.sha256

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          aico-linux-amd64
          aico-linux-arm64
          aico-darwin-amd64
          aico-darwin-arm64
          aico_linux_amd64.tar.gz
          aico_linux_arm64.tar.gz
          aico_darwin_amd64.tar.gz
          aico_darwin_arm64.tar.gz
          aico_linux_amd64.tar.gz.sha256
          aico_linux_arm64.tar.gz.sha256
          aico_darwin_amd64.tar.gz.sha256
          aico_darwin_arm64.tar.gz.sha256
        body: ${{ steps.release_body.outputs.body }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
