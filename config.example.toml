# aico configuration file
#
# This file should be placed in one of the following locations:
# 1. $AI_ASSISTANT_CONFIG_PATH (if set)
# 2. $XDG_CONFIG_HOME/com.micheam.aico/config.toml (if XDG_CONFIG_HOME is set)
# 3. $HOME/.config/com.micheam.aico/config.toml (default on macOS/Linux)
#
# If no config file is found, aico will automatically create one with default values.

# Path to the log file
# Default: $XDG_STATE_HOME/com.micheam.aico/aico.log
#   Linux:   ~/.local/state/com.micheam.aico/aico.log
#   macOS:   ~/Library/Logs/com.micheam.aico/aico.log
#   Windows: %LOCALAPPDATA%\com.micheam.aico\aico.log
# Can be absolute or relative path (relative paths are resolved from config file location)
logfile = "aico.log"

# Default provider to use when model name is ambiguous
# When multiple providers support the same model name, this provider will be checked first.
# Valid values: "anthropic", "openai", "groq", "cerebras"
# Default: "" (no default provider)
default_provider = ""

# Model to use for text generation
# Supports two formats:
#   - Simple name: "claude-haiku-4-5" (uses default_provider if ambiguous)
#   - Qualified name: "anthropic:claude-haiku-4-5" (explicit provider)
# Default: "claude-haiku-4-5"
model = "claude-haiku-4-5"

# Per-model generation settings
# Only models listed here get any settings; everything else runs on the
# provider's defaults. Always quote the key (model names may contain "." or ":").
# The key accepts the same two formats as `model`: a simple name or a
# qualified "provider:model" name (the qualified key takes precedence).
#
#   effort     - "low", "medium" or "high" (understood by every provider).
#                Prefix a provider-specific value with its provider to pass
#                it through as-is, e.g. "anthropic:xhigh" or "openai:minimal".
#                Configuring effort for a model that doesn't support it
#                (e.g. a non-reasoning OpenAI model) results in an API error.
#   max_tokens - maximum number of output tokens per generation.
#
# [models."claude-opus-5-5"]
# effort = "high"
#
# [models."claude-opus-5"]
# effort = "anthropic:xhigh"
# max_tokens = 65536
#
# [models."gpt-5.6-sol"]
# effort = "high"

# Persona configurations
# Each persona has a description and a system message that defines its behavior.
# You can define multiple personas and switch between them during conversations.

[persona.default]
description = "Default"
message = "You're aico, my personal AI assistant.You're here to help me with my daily tasks."

# Example: Add more personas as needed
# [persona.coding]
# description = "Coding Assistant"
# message = "You're an expert software engineer. Help me write clean, efficient code."
#
# [persona.writer]
# description = "Creative Writer"
# message = "You're a creative writing assistant. Help me craft engaging stories and content."
